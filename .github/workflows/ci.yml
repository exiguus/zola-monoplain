name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-format:
    name: Check Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Common Setup
        uses: ./.github/actions/common-setup

      - name: Install Node dependencies
        # pnpm store verify workaround 'NODE_OPTIONS=--max-old-space-size=4096'
        run: NODE_OPTIONS=--max-old-space-size=4096 CI=1 PUPPETEER_SKIP_DOWNLOAD=1 pnpm ci

      - name: Setup Rust
        uses: moonrepo/setup-rust@v1.3.0

      - name: Cache Rust toolchain, and rumdl
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-rumdl-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rumdl-
            ${{ runner.os }}-cargo-

      - name: Install rumdl
        run: command -v rumdl >/dev/null 2>&1 || { command -v cargo >/dev/null 2>&1 && { echo "Installing rumdl..."; cargo install --force rumdl; } || { echo "Install cargo to be able to install rumdl"; exit 1; } }

      - name: format
        run: pnpm format:check

  analyze-typescript:
    name: Analyze TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Common Setup
        uses: ./.github/actions/common-setup

      - name: FTA Action
        id: fta-action
        uses: exiguus/fta-github-action@v0.1.3
        with:
          project_path: ./
          config_path: fta.config.json
          extensions: .js,.jsx,.mjs,.cjs,.ts,.tsx

      - name: Print Output Summary
        id: output-summary
        run: echo -e "\nSummary:\n${{ steps.fta-action.outputs.summary }}"

      - name: Print Output Details
        id: output-details
        run: echo -e "\nDetails:\n${{ steps.fta-action.outputs.details }}"

      - name: Upload Output Summary
        id: upload-output
        uses: actions/upload-artifact@v7
        with:
          name: output
          path: output.json
